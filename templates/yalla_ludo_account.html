<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شراء وبيع الحسابات - متجر الجنوبي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }
        .btn-telegram {
            background-color: #0088cc;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-telegram:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>👤 شراء وبيع حسابات يلا لودو</h2>
        <p>أدخل تفاصيل الحساب المطلوب أو رغبتك في الشراء والبيع</p>

        <!-- حقل معلومات الحساب / الآيدي -->
        <input type="text" id="player_id" placeholder="رقم الآيدي أو مواصفات الحساب المطلوب">

        <!-- حقل فئة الحساب -->
        <select id="amount">
            <option value="">اختر ميزانية أو نوع الحساب</option>
            <option value="حساب ليفل عالي مع لودو كافيه">حساب ليفل عالي مع لودو كافيه</option>
            <option value="حساب برونز / فضي بسعر مناسب">حساب برونز / فضي بسعر مناسب</option>
            <option value="حساب ملكي (Royal)">حساب ملكي (Royal)</option>
            <option value="عرض بيع حساب خاص بي">عرض بيع حساب خاص بي</option>
        </select>

        <!-- حقل ملاحظات إضافية -->
        <textarea id="notes" placeholder="ملاحظات إضافية أو تفاصيل التواصل (اختياري)"></textarea>

        <!-- أزرار الإرسال المباشر -->
        <button class="btn-whatsapp" onclick="sendOrder('whatsapp')">إرسال تفاصيل الحساب عبر الواتساب 🟢</button>
        <button class="btn-telegram" onclick="sendOrder('telegram')">إرسال تفاصيل الحساب عبر تيليجرام 🔵</button>
    </div>

    <script>
        function sendOrder(platform) {
            let playerId = document.getElementById('player_id').value;
            let amount = document.getElementById('amount').value;
            let notes = document.getElementById('notes').value;

            if (!playerId) {
                alert("يرجى إدخال رقم الآيدي أو مواصفات الحساب أولاً!");
                return;
            }

            let message = `🛒 *طلب قسم الحسابات - متجر الجنوبي*%0a` +
                          `👤 *التفاصيل / الآيدي*: ${playerId}%0a` +
                          `💰 *نوع الحساب / الميزانية*: ${amount ? amount : 'غير محدد'}%0a` +
                          `📝 *ملاحظات*: ${notes ? notes : 'لا توجد'}`;

            if (platform === 'whatsapp') {
                let phoneNo = "9647800888534";
                window.open(`https://wa.me/${phoneNo}?text=${message}`, '_blank');
            } else if (platform === 'telegram') {
                let tgUsername = "H_XG1";
                window.open(`https://t.me/${tgUsername}?text=${message}`, '_blank');
            }
        }
    </script>

</body>
</html>
