<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>شحن كوينز يلا لودو - متجر الجنوبي</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 20px;
        }
        .container {
            max-width: 400px;
            background: #fff;
            padding: 20px;
            margin: auto;
            border-radius: 10px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        .btn-whatsapp {
            background-color: #25d366;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-whatsapp:hover {
            background-color: #1ebe5d;
        }
        .btn-telegram {
            background-color: #0088cc;
            color: white;
            padding: 12px;
            border: none;
            width: 100%;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            margin-top: 10px;
        }
        .btn-telegram:hover {
            background-color: #006699;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>💎 شحن كوينز يلا لودو</h2>
        <p>املأ التفاصيل أدناه واختار طريقة الإرسال المناسبة لك</p>

        <!-- حقل آيدي اللاعب -->
        <input type="text" id="player_id" placeholder="أدخل آيدي اللاعب (ID)">

        <!-- حقل اختيار الفئة / الرصيد -->
        <select id="amount">
            <option value="">اختر فئة الشحن</option>
            <option value="10,000 كوينز">10,000 كوينز</option>
            <option value="50,000 كوينز">50,000 كوينز</option>
            <option value="100,000 كوينز">100,000 كوينز</option>
            <option value="500,000 كوينز">500,000 كوينز</option>
        </select>

        <!-- حقل ملاحظات إضافية -->
        <textarea id="notes" placeholder="ملاحظات إضافية (اختياري)"></textarea>

        <!-- أزرار الإرسال (واتساب وتيليجرام) -->
        <button class="btn-whatsapp" onclick="sendOrder('whatsapp')">إرسال عبر الواتساب 🟢</button>
        <button class="btn-telegram" onclick="sendOrder('telegram')">إرسال عبر تيليجرام 🔵</button>
    </div>

    <script>
        function sendOrder(platform) {
            // 1. سحب البيانات من الحقول
            let playerId = document.getElementById('player_id').value;
            let amount = document.getElementById('amount').value;
            let notes = document.getElementById('notes').value;

            // 2. التحقق من إدخال الحقول الأساسية
            if (!playerId) {
                alert("يرجى إدخال آيدي اللاعب أولاً!");
                return;
            }
            if (!amount) {
                alert("يرجى اختيار فئة الشحن!");
                return;
            }

            // 3. ترتيب نص الرسالة ليصلك جاهزاً ومنظماً
            let message = `🛒 *طلب شحن كوينز جديد*:%0a` +
                          `👤 *آيدي اللاعب*: ${playerId}%0a` +
                          `💰 *الفئة المطلوبة*: ${amount}%0a` +
                          `📝 *ملاحظات*: ${notes ? notes : 'لا توجد'}`;

            // 4. التوجيه حسب المنصة المختارة
            if (platform === 'whatsapp') {
                // رقم الواتساب الخاص بك مع رمز العراق (964)
                let phoneNo = "9647800888534";
                let url = `https://wa.me/${phoneNo}?text=${message}`;
                window.open(url, '_blank');
            } 
            else if (platform === 'telegram') {
                // معرف تيليجرام الخاص بك
                let tgUsername = "H_XG1";
                let url = `https://t.me/${tgUsername}?text=${message}`;
                window.open(url, '_blank');
            }
        }
    </script>

</body>
</html>
