<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تفعيلات VIP على الأيدي - متجر حمودي الجنوبي</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(rgba(10, 10, 15, 0.75), rgba(20, 20, 30, 0.85)),
                        url('https://images.unsplash.com/photo-1503376780353-7e6692767b70?q=80&w=1920&auto=format&fit=crop') no-repeat center center fixed;
            background-size: cover; color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 30px 20px;
        }
        header { text-align: center; margin-bottom: 25px; position: relative; width: 100%; max-width: 650px; }
        .back-btn {
            position: absolute; top: 0; right: 0; background: rgba(142, 68, 173, 0.3); border: 1px solid #9b59b6;
            color: #e8daef; padding: 6px 14px; border-radius: 10px; text-decoration: none; font-size: 14px;
        }
        .form-container {
            width: 100%; max-width: 650px; background: rgba(15, 15, 25, 0.9); border: 2px solid #d4af37; border-radius: 20px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .section-title { font-size: 16px; font-weight: bold; color: #f1c40f; margin-bottom: 12px; border-bottom: 1px dashed rgba(212,175,55,0.3); padding-bottom: 5px; }

        /* عروض تفعيلات الـ VIP */
        .offers-list { display: flex; flex-direction: column; gap: 12px; margin-bottom: 20px; }
        .offer-card {
            background: linear-gradient(135deg, #873232, #c0392b);
            border: 2px solid #e74c3c;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .offer-card label { cursor: pointer; display: block; font-size: 16px; font-weight: bold; color: #ffffff; }
        .offer-card.selected {
            background: linear-gradient(135deg, #7d6608, #b7950b);
            border-color: #f1c40f;
            box-shadow: 0 0 15px rgba(241, 196, 15, 0.6);
            transform: scale(1.01);
        }

        /* صندوق طرق الدفع والأرقام */
        .payment-box { background: linear-gradient(135deg, #1b4f72, #2980b9); border-radius: 12px; padding: 15px; margin-bottom: 20px; }
        .payment-options { display: flex; justify-content: space-around; margin-top: 10px; font-size: 15px; font-weight: bold; }

        .pay-method {
            text-align: center;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 8px 12px;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: 0.3s;
        }
        .pay-method:hover { background: rgba(0, 0, 0, 0.4); border-color: #f1c40f; }
        .pay-method input[type="radio"] { accent-color: #f1c40f; cursor: pointer; width: 16px; height: 16px; }

        /* إظهار الأرقام بوضوح تحت الخيارات */
        .pay-number {
            display: none;
            color: #f1c40f;
            font-weight: bold;
            font-size: 15px;
            margin-top: 15px;
            background: rgba(0,0,0,0.5);
            border: 2px solid #f1c40f;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            letter-spacing: 0.5px;
            box-shadow: 0 0 10px rgba(241, 196, 15, 0.4);
        }

        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 14px; color: #dcdde1; margin-bottom: 6px; }

        /* الإطار الذهبي المتحرك */
        @keyframes goldGlow {
            0% { border-color: #d4af37; box-shadow: 0 0 5px rgba(212, 175, 55, 0.4); }
            50% { border-color: #f1c40f; box-shadow: 0 0 15px rgba(241, 196, 15, 0.8), inset 0 0 5px rgba(241, 196, 15, 0.3); }
            100% { border-color: #d4af37; box-shadow: 0 0 5px rgba(212, 175, 55, 0.4); }
        }

        .input-field {
            width: 100%;
            background: rgba(20, 20, 30, 0.95);
            border: 2px solid #d4af37;
            border-radius: 12px;
            padding: 12px;
            color: #f1c40f;
            outline: none;
            font-size: 15px;
            font-weight: bold;
            animation: goldGlow 3s infinite ease-in-out;
        }
        .input-field::placeholder { color: #8c8c9e; font-weight: normal; }

        /* حقل رقم الصيد (يختفي عند اختيار الماستركارد) */
        #balance-field-container {
            transition: all 0.4s ease-in-out;
            max-height: 100px;
            overflow: hidden;
            opacity: 1;
        }
        #balance-field-container.hidden {
            max-height: 0;
            opacity: 0;
            margin-bottom: 0;
            pointer-events: none;
        }

        .submit-section { display: flex; gap: 15px; margin-top: 25px; }
        .submit-btn { flex: 1; padding: 12px; border-radius: 12px; text-decoration: none; font-size: 15px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; color: white; }
        .btn-whatsapp { background-color: #27ae60; }
        .btn-telegram { background-color: #2980b9; }
    </style>
</head>
<body>
    <header>
        <a href="/yalla-ludo" class="back-btn">⬅ للخلف</a>
        <h1 style="color: #fff; text-shadow: 0 0 10px rgba(241,196,15,0.8); font-size: 24px;">تفعيلات VIP عبر الأيدي (ID)</h1>
    </header>

    <div class="form-container">
        <div class="section-title">اختر عرض تفعيل الـ VIP:</div>

        <div class="offers-list">
            <div class="offer-card" onclick="selectOffer(this, 'vip1')">
                <input type="radio" id="vip1" name="offer" style="display:none;"><label for="vip1">🛡️ تفعيل فارس = 20,000$</label>
            </div>
            <div class="offer-card" onclick="selectOffer(this, 'vip2')">
                <input type="radio" id="vip2" name="offer" style="display:none;"><label for="vip2">👑 تفعيل لواء = 55,000$</label>
            </div>
        </div>

        <!-- طرق الدفع -->
        <div class="payment-box">
            <div style="font-weight: bold; margin-bottom: 10px; font-size: 14px;">اختر طريقة الدفع (انقر على الخيار لإظهار الرقم):</div>

            <div class="payment-options">
                <label class="pay-method" onclick="togglePayment('asiacell')">
                    <input type="radio" name="pay_select" id="radio-asiacell"> أسياسيل
                </label>
                <label class="pay-method" onclick="togglePayment('atheer')">
                    <input type="radio" name="pay_select" id="radio-atheer"> أثير
                </label>
                <label class="pay-method" onclick="togglePayment('mastercard')">
                    <input type="radio" name="pay_select" id="radio-mastercard"> ماستركارد
                </label>
            </div>

            <!-- الأرقام التي ستظهر تحت الخيارات مباشرة عند النقر -->
            <div id="num-asiasell" class="pay-number">📞 رقم أسياسيل للتحويل: 07739106111</div>
            <div id="num-atheer" class="pay-number">📞 رقم أثير للتحويل: 07800888534</div>
            <div id="num-mastercard" class="pay-number">💳 رقم الماستركارد: 3276376591<br>👤 باسم: محمد حسين</div>
        </div>

        <!-- أيدي الحساب -->
        <div class="input-group">
            <label>أيدي الحساب (ID):</label>
            <input type="text" class="input-field" placeholder="أدخل أيدي الحساب الخاص بك هنا">
        </div>

        <!-- رقم الصيد -->
        <div class="input-group" id="balance-field-container">
            <label>رقم الصيد (رقم الهاتف المحوّل منه):</label>
            <input type="text" class="input-field" placeholder="ضع رقم الرصيد هنا">
        </div>

        <div class="input-group">
            <label>إرفاق صورة إيصال التحويل (اختياري):</label>
            <input type="file" class="input-field" accept="image/*" style="padding: 8px; animation: none; color: white;">
        </div>

        <div class="submit-section">
            <a href="https://wa.me/9647800888534" target="_blank" class="submit-btn btn-whatsapp">واتساب</a>
            <a href="https://t.me/H_XG1" target="_blank" class="submit-btn btn-telegram">تيليجرام</a>
        </div>
    </div>

    <script>
        function selectOffer(cardElement, inputId) {
            document.querySelectorAll('.offer-card').forEach(card => {
                card.classList.remove('selected');
            });
            cardElement.classList.add('selected');
            document.getElementById(inputId).checked = true;
        }

        function togglePayment(method) {
            // تحديد الـ Radio المناسب تلقائياً عند النقر على المربع
            document.getElementById('radio-asiacell').checked = (method === 'asiacell');
            document.getElementById('radio-atheer').checked = (method === 'atheer');
            document.getElementById('radio-mastercard').checked = (method === 'mastercard');

            // إخفاء جميع الأرقام أولاً
            document.getElementById('num-asiasell').style.display = 'none';
            document.getElementById('num-atheer').style.display = 'none';
            document.getElementById('num-mastercard').style.display = 'none';

            const balanceContainer = document.getElementById('balance-field-container');

            // إظهار الرقم المطلوب وإدارة حقل رقم الصيد
            if (method === 'asiacell') {
                document.getElementById('num-asiasell').style.display = 'block';
                balanceContainer.classList.remove('hidden');
            } else if (method === 'atheer') {
                document.getElementById('num-atheer').style.display = 'block';
                balanceContainer.classList.remove('hidden');
            } else if (method === 'mastercard') {
                document.getElementById('num-mastercard').style.display = 'block';
                balanceContainer.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
